url: https://gumreport.com
author: The Gum Inspector
intro: Every time I eat out, I check under the table for gum. Here is what I find, restaurant by restaurant.
restaurants_message: A quick look under each table during cleanup keeps it spotless. If your place shows up here, check your tables and I will happily post an update.
everyone_message: Done with your gum? Wrap it in a napkin and throw it away. Never stick it under the table.
