name: Deploy posting page

# Puts the posting page live at post.gumreport.com (a Cloudflare Worker).
# Needs three repository secrets: CLOUDFLARE_API_TOKEN, POST_PASSWORD, POST_GITHUB_TOKEN.
on:
  push:
    branches: [main]
    paths: ["poster/**", ".github/workflows/deploy-poster.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: poster
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      POST_PASSWORD: ${{ secrets.POST_PASSWORD }}
      POST_GITHUB_TOKEN: ${{ secrets.POST_GITHUB_TOKEN }}
    steps:
      - name: Check the secrets are set
        id: check
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$POST_PASSWORD" ] || missing="$missing POST_PASSWORD"
          [ -n "$POST_GITHUB_TOKEN" ] || missing="$missing POST_GITHUB_TOKEN"
          if [ -n "$missing" ]; then
            echo "::notice::Skipping deploy. Add these repository secrets first:$missing"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.check.outputs.ready == 'true'
      - uses: actions/setup-node@v7
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 22
      - name: Deploy the worker
        if: steps.check.outputs.ready == 'true'
        working-directory: poster
        run: npx --yes wrangler@4 deploy
      - name: Save the password and GitHub key in Cloudflare
        if: steps.check.outputs.ready == 'true'
        working-directory: poster
        run: |
          printf '%s' "$POST_PASSWORD" | npx --yes wrangler@4 secret put POST_PASSWORD
          printf '%s' "$POST_GITHUB_TOKEN" | npx --yes wrangler@4 secret put GITHUB_TOKEN
